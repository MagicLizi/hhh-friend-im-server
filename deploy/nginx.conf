# 宿主机上已有的 Nginx：放进 /etc/nginx/conf.d/，域名和证书路径换成自己的。
# 证书用 certbot 的 webroot 方式申请和续期（见 README「部署」），续期后由 certbot 的 deploy hook 重载 Nginx。
# 不开访问日志：文件请求的 Authorization 头里是登录凭证；错误日志也会记客户端 IP 和请求路径，只留 crit。
server {
    listen 80;
    listen [::]:80;
    server_name im.example.com;
    access_log off;
    error_log /dev/null crit;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt/friend-im;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://im.example.com$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name im.example.com;

    ssl_certificate     /etc/letsencrypt/live/im.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/im.example.com/privkey.pem;
    add_header Strict-Transport-Security "max-age=31536000" always;

    access_log off;
    error_log /dev/null crit;
    # 文件按段上传，每段最多 8 MiB。
    client_max_body_size 9m;

    # 长连接（wss）：客户端每 30 秒保活一次，超时设得比它长；推送不经 Nginx 缓冲。
    location = /v1/ws {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 3s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;
    }

    # 文件上传下载与健康检查：边收边转，不在 Nginx 里整段缓存。
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_connect_timeout 3s;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
