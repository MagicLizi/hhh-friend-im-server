# 宿主机上已有的 Nginx：放进 /etc/nginx/conf.d/，域名和证书路径换成自己的（证书可用 certbot 申请）。
# 不开访问日志：文件请求的 Authorization 头里是登录凭证。
server {
    listen 80;
    server_name im.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name im.example.com;

    ssl_certificate     /etc/letsencrypt/live/im.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/im.example.com/privkey.pem;

    access_log off;
    # 文件按段上传，每段最多 8 MiB。
    client_max_body_size 9m;

    # 长连接：客户端每 30 秒保活一次，超时设得比它长。
    location = /v1/ws {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 文件上传下载：边收边转，不在 Nginx 里整段缓存。
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
